services:
  - type: web
    name: orbit-backend
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    autoDeploy: true
    buildFilter:
      paths:
        - backend/**
    envVars:
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: info
      - key: PUBLIC_BASE_URL
        value: https://0rbit-api.vercel.app

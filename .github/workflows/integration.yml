name: Integration tests

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pinterest:
    name: Pinterest download (external)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NODE_ENV: test
      DATA_ENCRYPTION_KEY: orbit-integration-test-key-with-32-chars
      MONGO_URI: ""
      OWNER_API_KEY: integration-owner-token
      ADMIN_API_KEY: integration-admin-token
      PUBLIC_API_KEY: integration-public-token
      OWNER_EMAIL: integration-owner@orbit.test
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        working-directory: backend
        run: bun install --frozen-lockfile

      - name: Run Pinterest integration test
        working-directory: backend
        run: bun test src/tests/pinterest.test.ts --timeout 30000
